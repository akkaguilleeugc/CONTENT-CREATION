.panel { background: #11171f; border: 1px solid rgba(255, 255, 255, 0.07); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(229, 237, 248, 0.45); white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
.stop { display: inline-block; width: 0.16em; height: 0.16em; background: #FF0055; margin-left: 0.04em; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; }
.mask > span { display: inline-block; }
.btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; font-weight: 500; }
.kbd { font-size: 10px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 5px; padding: 1px 5px; color: rgba(229, 237, 248, 0.6); }
/* overlay (screen space) */
#overlay { position: absolute; inset: 0; pointer-events: none; }
.wipe { position: absolute; inset: 0; visibility: hidden; }
.cap { position: absolute; left: 0; top: 0; width: 1080px; visibility: hidden; white-space: nowrap; }
.cap .ln { display: block; text-align: center; line-height: 0.92; }
.cap .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.05em 0.16em; margin-bottom: -0.16em; }
.cap .w { display: inline-block; }
#obj { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; background: #D4F53C; display: flex; align-items: center; justify-content: center; }
#obj img { display: block; width: 62%; height: auto; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.touch { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 3px solid rgba(255, 255, 255, 0.85); visibility: hidden; }
</style>

/* ───────────── time & easing ───────────── */
const W = 1080, H = 1920, BPM = 128, BEAT = 60 / BPM, DUR = 45;
const LIME = '#D4F53C', INK = '#0B0F14', ROYAL = '#2F5BFF', PINK = '#FF0055', NAVY = '#0B1A5C';
const tb = (b) => b * BEAT;
const SCENES = [0, 8, 40, 72, 80, 96]; // hook · laptop · iPhone · both · drop/end
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
function spring(dt, w = 16, z = 0.8) {
  if (dt <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const pulse = (dt, k = 0.06) => (dt < 0 ? 0 : (dt / k) * Math.exp(1 - dt / k));
const EX = (t, t0, d = 0.45) => expoOut(clamp((t - t0) / d));
const IO = (t, t0, d = 0.4) => expoInOut(clamp((t - t0) / d));
const SPt = (t, t0, w = 16, z = 0.8) => spring(t - t0, w, z);
const grow = (t, t0, w = 17, z = 0.78) => clamp(spring(t - t0, w, z), 0, 1.25);

/** clip an element so it appears to grow out of (p=0) a rect R (element-local px) into itself (p=1) */
function clipGrow(el, R, p, rFull = 12) {
  const E = el._r;
  if (p >= 1) { el.style.clipPath = 'none'; return; }
  if (p <= 0.002) { el.style.clipPath = 'inset(50% 50% 50% 50%)'; return; }
  const q = 1 - p;
  el.style.clipPath = `inset(${R.y * q}px ${(E.w - R.x - R.w) * q}px ${(E.h - R.y - R.h) * q}px ${R.x * q}px round ${lerp(R.r || 8, rFull, p)}px)`;
}
const wipeDown = (el, p) => { el.style.clipPath = p >= 1 ? 'none' : `inset(0 0 ${(1 - clamp(p)) * 100}% 0)`; };
const wipeUp = (el, p) => { el.style.clipPath = p <= 0 ? 'none' : `inset(0 0 ${clamp(p) * 100}% 0)`; };

    for (const k of ['x', 'y', 'w', 'h', 'rot']) if (T[k] != null) P[k] += (T[k] - P[k]) * s;

  CAM.sort((a, b) => a.t0 - b.t0); OBJ.sort((a, b) => a.t0 - b.t0); CUR.sort((a, b) => a.t0 - b.t0); CLICKS.sort((a, b) => a - b);

window.seek = seek;
window.renderAudio = renderAudio;
window.DUR = DUR;
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('t')) seek(parseFloat(q.get('t')));
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
