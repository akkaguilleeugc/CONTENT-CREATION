<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KROOPY on every screen — 45s launch (1080×1920 · 128 BPM)</title>
<!--
  Feature launch: KROOPY installs on your laptop and on your iPhone home screen.
  Every style is computed from time inside window.seek(t) — no CSS animations, timers or carried state.
  Built from src.html by build.cjs (inlines Coolvetica, 212 Baby Girl, Inter, the OO mark, the wordmark and the app's Lucide icons).
-->
<style>
@font-face { font-family: 'Coolvetica'; src: url(data:font/otf;base64,__COOL_B64__) format('opentype'); }
@font-face { font-family: 'Baby'; src: url(data:font/otf;base64,__BABY_B64__) format('opentype'); }
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url(data:font/woff2;base64,__INTER_B64__) format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: #0B0F14; overflow: hidden; }
body { font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0B0F14; }
#world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.dev { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.abs { position: absolute; }
.row { display: flex; align-items: center; }
.ico { display: inline-block; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.cool { font-family: 'Coolvetica', sans-serif; letter-spacing: -0.01em; }
.baby { font-family: 'Baby', 'Coolvetica', sans-serif; }
.t2 { color: rgba(229, 237, 248, 0.68); }
.t3 { color: rgba(229, 237, 248, 0.45); }
.t4 { color: rgba(229, 237, 248, 0.28); }
.lime { color: #D4F53C; }
.pink { color: #FF0055; }
.royal { color: #2F5BFF; }
.panel { background: #11171f; border: 1px solid rgba(255, 255, 255, 0.07); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(229, 237, 248, 0.45); white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
.stop { display: inline-block; width: 0.16em; height: 0.16em; background: #FF0055; margin-left: 0.04em; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; }
.mask > span { display: inline-block; }
.btn { position: absolute; display: flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; font-weight: 500; }
.kbd { font-size: 10px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 5px; padding: 1px 5px; color: rgba(229, 237, 248, 0.6); }
/* overlay (screen space) */
#overlay { position: absolute; inset: 0; pointer-events: none; }
.wipe { position: absolute; inset: 0; visibility: hidden; }
.cap { position: absolute; left: 0; top: 0; width: 1080px; visibility: hidden; white-space: nowrap; }
.cap .ln { display: block; text-align: center; line-height: 0.92; }
.cap .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.05em 0.16em; margin-bottom: -0.16em; }
.cap .w { display: inline-block; }
#obj { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; background: #D4F53C; display: flex; align-items: center; justify-content: center; }
#obj img { display: block; width: 62%; height: auto; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.touch { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 3px solid rgba(255, 255, 255, 0.85); visibility: hidden; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="fObj" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur id="gObj" stdDeviation="0 0" /></filter>
    <filter id="fCur" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur id="gCur" stdDeviation="0 0" /></filter>

  </defs>
</svg>
<div id="frame">
  <div id="wipes"></div>
  <div id="world">
    <div id="devs">
      <div id="laptop" class="dev"></div>
      <div id="phone" class="dev"></div>
    </div>
    <div id="obj"><img alt=""><div id="badge" style="position:absolute;right:-9%;top:-9%;width:34%;height:34%;border-radius:50%;background:#FF0055;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff"><span>3</span></div></div>
    <div id="touch" class="touch"></div>
    <div id="cursor">
      <svg width="28" height="40" viewBox="0 0 28 40" style="overflow:visible">
        <path d="M2 2 L2 31 L9.5 24.5 L14.5 36 L19.5 33.8 L14.6 22.6 L24.5 22.6 Z" transform="translate(1.2 2.4)" fill="rgba(0,0,0,0.38)" />
        <path d="M2 2 L2 31 L9.5 24.5 L14.5 36 L19.5 33.8 L14.6 22.6 L24.5 22.6 Z" fill="#fff" stroke="#0B0F14" stroke-width="1.8" stroke-linejoin="round" />
      </svg>
    </div>
  </div>
  <div id="overlay"><div id="caps"></div></div>

<script>
'use strict';
const ICONS = __ICONS_JSON__;
const OO_SRC = 'data:image/png;base64,__OO_B64__';
const WORDMARK_SRC = 'data:image/png;base64,__WM_B64__';

/* ───────────── time & easing ───────────── */
const W = 1080, H = 1920, BPM = 128, BEAT = 60 / BPM, DUR = 45;
const LIME = '#D4F53C', INK = '#0B0F14', ROYAL = '#2F5BFF', PINK = '#FF0055', NAVY = '#0B1A5C';
const tb = (b) => b * BEAT;
const SCENES = [0, 8, 40, 72, 80, 96]; // hook · laptop · iPhone · both · drop/end
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
function spring(dt, w = 16, z = 0.8) {
  if (dt <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const pulse = (dt, k = 0.06) => (dt < 0 ? 0 : (dt / k) * Math.exp(1 - dt / k));
const EX = (t, t0, d = 0.45) => expoOut(clamp((t - t0) / d));
const IO = (t, t0, d = 0.4) => expoInOut(clamp((t - t0) / d));
const SPt = (t, t0, w = 16, z = 0.8) => spring(t - t0, w, z);
const grow = (t, t0, w = 17, z = 0.78) => clamp(spring(t - t0, w, z), 0, 1.25);

/* ───────────── helpers ───────────── */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const I = (n, s = 16, st = '') => `<span class="ico" style="width:${s}px;height:${s}px;${st}">${ICONS[n] || ''}</span>`;
const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const vis = (el, on) => { el.style.visibility = on ? 'inherit' : 'hidden'; };
/** clip an element so it appears to grow out of (p=0) a rect R (element-local px) into itself (p=1) */
function clipGrow(el, R, p, rFull = 12) {
  const E = el._r;
  if (p >= 1) { el.style.clipPath = 'none'; return; }
  if (p <= 0.002) { el.style.clipPath = 'inset(50% 50% 50% 50%)'; return; }
  const q = 1 - p;
  el.style.clipPath = `inset(${R.y * q}px ${(E.w - R.x - R.w) * q}px ${(E.h - R.y - R.h) * q}px ${R.x * q}px round ${lerp(R.r || 8, rFull, p)}px)`;
}
const wipeDown = (el, p) => { el.style.clipPath = p >= 1 ? 'none' : `inset(0 0 ${(1 - clamp(p)) * 100}% 0)`; };
const wipeUp = (el, p) => { el.style.clipPath = p <= 0 ? 'none' : `inset(0 0 ${clamp(p) * 100}% 0)`; };

/* ───────────── devices ───────────── */
const KL = 932 / 1440, LX = 74, LY = 654;           // laptop display: native 1440×900 → world
const KP = 430 / 390, PXo = 325, PYo = 515;         // phone screen: native 390×844 → world
const CL = { x: 540, y: 960 }, CP = { x: 540, y: 980 };
const icon = (sz, st = '') => `<div class="abs" style="width:${sz}px;height:${sz}px;border-radius:${sz * 0.25}px;background:${LIME};display:flex;align-items:center;justify-content:center;${st}"><img src="${OO_SRC}" style="width:62%"></div>`;
const bars = (n) => `<span class="row" style="gap:1.5px;align-items:flex-end;height:10px">${[4, 7, 10, 13].map((h, i) => `<i style="display:block;width:2.5px;height:${h * 0.75}px;border-radius:1px;background:currentColor;opacity:${i < n ? 1 : 0.25}"></i>`).join('')}</span>`;

function laptopHTML() {
  const NAVI = [['LayoutDashboard', 'Overview', ''], ['Lightbulb', 'My Ideas', '2'], ['Clapperboard', 'Content Studio', '2'], ['CalendarDays', 'Calendar', ''], ['ListChecks', 'Tasks', '5']];
  const nav = (items, y0) => items.map(([ic, l, n], i) => `<div id="ln_${l.replace(/ /g, '')}" class="abs row" style="left:12px;top:${y0 + i * 38}px;width:232px;height:34px;padding:0 12px;gap:12px;font-size:14px;color:rgba(229,237,248,.8)">${I(ic, 17)}<span>${l}</span><span style="flex:1"></span>${n ? `<span style="font-size:11px;min-width:20px;height:20px;border-radius:10px;text-align:center;line-height:20px;${l === 'Tasks' ? `background:${LIME};color:${INK}` : 'background:rgba(255,255,255,.07)'}">${n}</span>` : ''}</div>`).join('');
  const kpis = [['3', 'Pending videos', 'idea → ready', 'Lightbulb'], ['2', 'In production', 'rec · edit · review', 'Film'], ['1', 'Scheduled', 'ready to go live', 'CalendarClock'], ['2', 'Published', 'November', 'Send', true], ['5', 'Open ideas', 'in your idea bank', 'Sparkles'], ['8', 'Tasks to do', 'across all lists', 'ListChecks']];
  const today = [['Invoice for October', 'Overdue', '', 1], ['Shoot day — coffee spots', 'Event · until 13:00', '09:30'], ['Record content', 'Habit', '10:00'], ['Reply to brand email (Lisbon collab)', 'Task', '11:00'], ['Gym', 'Task', '19:00'], ['Export final cut — editing tricks video', 'Task · 1/3', ''], ['Plan next week’s content', 'Task', '']];
  const ring = (v, l, s, x, frac) => `<div class="abs" style="left:${x}px;top:62px;width:90px;text-align:center">
      <svg width="64" height="64" viewBox="0 0 64 64" style="display:block;margin:0 auto"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/><circle cx="32" cy="32" r="27" fill="none" stroke="${LIME}" stroke-width="5" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="${169.6 * frac} 999"/></svg>
      <div class="abs cool" style="left:0;top:20px;width:90px;font-size:20px">${v}</div><div style="font-size:12px;margin-top:8px">${l}</div><div class="t3" style="font-size:11px">${s}</div></div>`;
  const cols = [['Idea', 0, []], ['Planning', 1, [['Q&A — 10K followers special', '9%', 'No date', ['#FF0055', '#EFF8FF']]]], ['Script', 1, [['Why I stopped chasing trends', '18%', 'No date', ['#FF0055', '#8EA6FF']]]], ['Ready to Record', 1, [['Coffee spots you need to try', '26%', '3 Dec', ['#D4F53C']]]], ['Recording', 0, []]];
  const card = (d, id) => `<div id="${id}" class="abs panel" style="left:10px;top:44px;width:180px;height:104px;border-radius:12px;background:#161d27;padding:12px">
      <div class="cool" style="font-size:15px;line-height:1.15">${d[0]}</div>
      <div class="row t3" style="gap:4px;font-size:11px;margin-top:6px">${d[3].map((c) => `<i style="display:block;width:6px;height:6px;border-radius:3px;background:${c}"></i>`).join('')}<span style="margin-left:3px">Vertical video</span></div>
      <div class="row" style="gap:6px;margin-top:9px"><div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08)"><div style="width:${d[1]};height:4px;border-radius:2px;background:${LIME}"></div></div><span class="t3" style="font-size:10px">${d[1]}</span></div>
      <div class="row t3" style="font-size:10.5px;margin-top:7px"><span style="color:${ROYAL}">${bars(2)}</span><span style="flex:1"></span>${d[2]}</div></div>`;
  // calendar chips (real sample items, desktop month view)
  const CH = { '11-18': [['19:30', 'Camera settings I use for every reel', 'pub', 1]], '11-22': [['18:00', 'I tried the 5AM creator routine', 'pubp', 1]], '11-23': [['', 'Invoice for October', 'task']],
    '11-24': [['09:30', 'Shoot day — coffee spots', 'rec'], ['11:00', 'Reply to brand email', 'task'], ['19:00', 'Gym', 'task']], '11-25': [['12:00', 'Call with Lisbon tourism board', 'meet'], ['18:00', 'Budget city guide — Lisbon', 'pubp']],
    '11-26': [['15:00', 'Editing block', 'edit'], ['', 'Buy new SD cards', 'task']], '11-27': [['21:00', 'Dinner with friends', 'meet'], ['', 'Why I stopped chasing trends', 'rec']], '11-28': [['17:00', 'Desk setup tour 2026', 'pub']],
    '11-29': [['', 'Finish colour grading course module 3', 'task']], '11-30': [['19:00', '3 editing tricks that doubled my retention', 'pubp']], '12-3': [['', 'Coffee spots you need to try', 'meet']] };
  const chipCol = { task: ['rgba(255,255,255,.07)', 'rgba(229,237,248,.8)'], rec: ['rgba(255,0,85,.16)', '#ff7aa5'], pubp: ['rgba(255,0,85,.16)', '#ff7aa5'], pub: ['rgba(47,91,255,.2)', '#9db2ff'], meet: ['rgba(212,245,60,.14)', LIME], edit: ['rgba(47,91,255,.2)', '#9db2ff'] };
  let cal = '';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
    const n = r * 7 + c; let d, m; if (n < 6) { d = 26 + n; m = 10; } else if (n < 36) { d = n - 5; m = 11; } else { d = n - 35; m = 12; }
    const key = `${m}-${d}`, chips = CH[key] || [];
    cal += `<div class="abs" style="left:${c * 160}px;top:${28 + r * 100}px;width:160px;height:100px;border-top:1px solid rgba(255,255,255,.06);border-left:${c ? '1px solid rgba(255,255,255,.04)' : '0'}">
      ${key === '11-24' ? `<div class="abs" style="left:8px;top:7px;width:24px;height:24px;border-radius:7px;background:${ROYAL}"></div>` : ''}
      <div class="abs" style="left:12px;top:11px;font-size:12px;${m !== 11 ? 'color:rgba(229,237,248,.3)' : ''}">${d}</div>
      ${chips.map((ch, k) => `<div class="abs row cchip" data-day="${key}" style="left:6px;top:${36 + k * 20}px;width:148px;height:17px;border-radius:5px;padding:0 6px;gap:5px;font-size:10px;background:${chipCol[ch[2]][0]};color:${chipCol[ch[2]][1]}">${ch[0] ? `<span style="opacity:.8">${ch[0]}</span>` : ''}<span class="ell" style="${ch[3] ? 'text-decoration:line-through;' : ''}">${ch[1]}</span></div>`).join('')}
    </div>`;
  }
  return `
  <div id="lid" class="abs" style="left:60px;top:640px;width:960px;height:624px;border-radius:26px 26px 8px 8px;background:#1b2029;border:1.5px solid rgba(255,255,255,.14);transform-origin:50% 100%">
    <div class="abs" style="left:477px;top:5px;width:6px;height:6px;border-radius:3px;background:#2c333e"></div>
    <div id="ldisp" class="abs" style="left:13px;top:13px;width:932px;height:582px;border-radius:10px;overflow:hidden;background:${INK}">
      <div id="lui" class="abs" style="left:0;top:0;width:1440px;height:900px;transform:scale(${KL});transform-origin:0 0">
        <div id="lApp" class="abs" style="left:0;top:80px;width:1440px;height:900px;overflow:hidden">
          <div id="lDesk" class="abs" style="left:0;top:0;width:1440px;height:900px">

              <div id="lSideBrand" class="abs" style="left:16px;top:16px;width:38px;height:38px"></div>

              <div class="abs" style="left:64px;top:38px;font-size:13px;font-weight:600">Creator <span class="baby lime" style="font-size:14px">studio</span></div>
              <div class="btn" style="left:12px;top:68px;width:232px;height:38px;border-radius:10px;background:${ROYAL};font-size:14px">${I('Plus', 16)}Create</div>
              <div class="abs row t3" style="left:12px;top:116px;width:232px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);padding:0 10px;gap:8px;font-size:13px">${I('Search', 15)}Search or jump to…<span style="flex:1"></span><span class="kbd">Ctrl K</span></div>
              <div class="abs eyebrow" style="left:22px;top:168px;font-size:10px">Workspace</div>
              <div id="lNavHi" class="abs" style="left:12px;width:232px;height:34px;border-radius:9px;background:rgba(255,255,255,.07)"></div>
              ${nav(NAVI, 186)}
              <div class="abs eyebrow" style="left:22px;top:390px;font-size:10px">Growth</div>
              ${nav([['Target', 'Trackers', ''], ['BarChart3', 'Analytics', '']], 408)}
              <div class="abs eyebrow" style="left:22px;top:500px;font-size:10px">Brand</div>
              ${nav([['Palette', 'Brand Kit', ''], ['FolderOpen', 'Asset Library', '']], 518)}
              <div class="abs row" style="left:24px;top:772px;gap:12px;font-size:14px;color:rgba(229,237,248,.8)">${I('Settings', 17)}Settings</div>
              <div class="abs" style="left:12px;top:812px;width:232px;height:1px;background:rgba(255,255,255,.06)"></div>
              <div class="abs" style="left:20px;top:828px;width:32px;height:32px;border-radius:16px;background:${ROYAL};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">C</div>
              <div class="abs" style="left:62px;top:827px;font-size:13px;font-weight:600">Creator</div>
              <div class="abs row t3" style="left:62px;top:845px;font-size:11px;gap:5px"><i style="display:block;width:6px;height:6px;border-radius:3px;background:${LIME}"></i>Saved locally</div>
            </div>
            <!-- Overview -->
            <div id="lvOv" class="abs" style="left:256px;top:0;width:1184px;height:900px">
              <div class="abs eyebrow" style="left:34px;top:26px">Tuesday · 24 November 2026</div>
              <div class="abs cool" style="left:32px;top:44px;font-size:60px;line-height:1">Good afternoon<span class="stop"></span></div>
              <div class="abs t2" style="left:34px;top:112px;font-size:14px">Today: 5 tasks, 1 recording. <span class="baby lime" style="font-size:16px">let’s create</span></div>
              <div class="btn" style="left:926px;top:94px;width:140px;height:38px;border-radius:10px;background:${LIME};color:${INK};font-size:13px">${I('Plus', 15)}Quick create <span class="kbd" style="color:${INK};border-color:rgba(11,15,20,.3)">N</span></div>
              <div class="abs" style="left:1078px;top:95px;width:36px;height:36px;border-radius:18px;background:${ROYAL};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">C</div>
              <div class="abs" style="left:880px;top:104px;color:rgba(229,237,248,.6)">${I('Bell', 17)}</div>
              <div id="lKpi" class="abs panel" style="left:34px;top:156px;width:1116px;height:100px;border-radius:16px">
                ${kpis.map(([v, l, s, ic, lime], i) => `<div class="abs" style="left:${i * 186}px;top:0;width:186px;height:100px;${i ? 'border-left:1px solid rgba(255,255,255,.05)' : ''}">
                  <div class="abs cool" style="left:18px;top:14px;font-size:36px;line-height:1;${lime ? `color:${LIME}` : ''}">${v}</div>
                  <div class="abs" style="left:18px;top:58px;font-size:13px;font-weight:600">${l}</div><div class="abs t3" style="left:18px;top:76px;font-size:11px">${s}</div>
                  <div class="abs t2" style="right:16px;top:14px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center">${I(ic, 15)}</div></div>`).join('')}
              </div>
              <div class="abs panel" style="left:34px;top:272px;width:600px;height:600px;border-radius:16px">
                <div class="abs cool" style="left:18px;top:18px;font-size:20px">Today <span class="t3" style="font-family:Inter;font-size:12px">0/9</span></div>
                <div class="abs t2 row" style="right:18px;top:20px;font-size:12px;gap:5px">${I('ArrowUpRight', 13)}All tasks</div>

function setDev(el, P, C) { el.style.transform = `translate(${P.dx}px,${P.dy}px) translate(${C.x}px,${C.y}px) scale(${P.s}) translate(${-C.x}px,${-C.y}px)`; show(el, P.on); }

function renderLaptop(t) {

function renderPhone(t) {
  const b = t / BEAT;
  const P = phonePose(t);
  setDev($('#phone'), P, CP);
  if (!P.on) return;
  const payoff = b >= 71.6;
  // screen power: on from b40; off b68; on again b72
  const offP = payoff ? 1 - EX(t, tb(72) + 0.05, 0.4) : IO(t, tb(68) + 0.05, 0.3);
  const off = $('#pOff');
  vis(off, offP > 0.001);
  off.style.clipPath = `inset(${(1 - offP) * 50}% 0 ${(1 - offP) * 50}% 0)`;
  $('#pbtn').style.transform = `translateX(${-3 * pulse(t - tb(68), 0.05)}px)`;
  // which screen
  const L = (id) => $(id);
  const browserOn = !payoff && b < 46.4;
  vis(L('#pBrowser'), browserOn);
  const sh = L('#pShare'); sh._r = sh._r || { w: 390, h: 488 };
  const shIn = clamp(spring(t - tb(42), 14, 0.84), 0, 1.03), shOut = IO(t, tb(44), 0.3);
  vis(sh, !payoff && b >= 42 && shOut < 1);
  sh.style.transform = `translateY(${(1 - shIn) * 488 + shOut * 488}px)`;
  L('#pShAdd').style.background = t > tb(43) - 0.02 && t < tb(44) + 0.1 ? 'rgba(255,255,255,.08)' : 'transparent';
  const ad = L('#pAdd');
  const adIn = clamp(spring(t - tb(44), 14, 0.84), 0, 1.03), adOut = IO(t, tb(46), 0.28);

  L('#pAddBtn').style.transform = `scale(${1 - 0.12 * pulse(t - tb(45))})`;
  // home screen: b46–b48.5 and b64–b68

  const homeOn = !payoff && ((b >= 46 && b < 49) || b >= 64);
  vis(home, homeOn);

  else if (b >= 64) { const p = EX(t, tb(64) + 0.02, 0.45); home.style.clipPath = `circle(${p * 980}px at 195px 844px)`; }

function renderCaptions(t) {
  let vmax = 0;
  for (const c of CAPS) {
    const t0 = tb(c.beats[0]) - 0.06, te = tb(c.exit) + c.exitDt, t1 = te + 0.5;
    const on = t >= t0 && t < t1;
    show(c.el, on);
    if (!on) continue;
    c.el.style.transform = `translateY(${c.y - c.el.offsetHeight / 2}px)`;
    c.words.forEach((w, i) => {
      const tw = tb(c.beats[Math.min(i, c.beats.length - 1)]);
      const yIn = (tt) => 118 * (1 - spring(tt - tw, 18, 0.7));
      let y = yIn(t);
      const pe = clamp((t - te - i * 0.025) / 0.26);
      if (pe > 0) y -= 125 * Math.pow(pe, 2.2);
      const punch = 1 + 0.08 * pulse(t - tw, 0.05);
      w.style.transform = `translateY(${y}%) scale(${punch})`;
      const v = Math.abs(yIn(t) - yIn(t - 1 / 240)) * 240 * (parseFloat(c.el.style.fontSize) / 100);
      const fast = v > 700 || (pe > 0.3 && pe < 1);
      w.style.filter = fast ? 'url(#fCap)' : 'none';
      if (fast) vmax = Math.max(vmax, v, pe > 0 ? 2500 : 0);
    });
  }
  gCap.setAttribute('stdDeviation', `0 ${Math.min(10, vmax / 420).toFixed(2)}`);
}

function renderWipes(t) {
  for (const w of WIPES) {
    const pin = expoOut(clamp((t - w.tIn) / w.din));
    const pout = w.keep ? 0 : expoInOut(clamp((t - w.tOut) / w.dout));
    const on = t >= w.tIn && (w.keep ? t < w.tOut : pout < 1);
    show(w.el, on);
    if (!on) continue;
    const a = w.from(), z = pout > 0 ? w.to() : a;
    const R = 2300;
    if (pout > 0) w.el.style.clipPath = `circle(${R * (1 - pout)}px at ${z.x}px ${z.y}px)`;
    else w.el.style.clipPath = `circle(${R * pin}px at ${a.x}px ${a.y}px)`;
  }
}

function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const b = t / BEAT;

  if (b >= 84) sc *= 1 + 0.03 * pulse(t - tb(Math.floor(b)), 0.06);

  show(objEl, w > 0.5 && !(b >= 80.2 && b < 83.9));
  const bd = $('#badge'); const bg = b >= 64 && b < 68.3 ? grow(t, tb(65) + 0.05, 20) * (1 - IO(t, tb(68), 0.25)) : 0;
  bd.style.transform = `scale(${bg})`; bd.style.fontSize = w * 0.2 + 'px'; vis(bd, bg > 0.002);
  const P2 = objAt(t - 1 / 240), c2 = camAt(t - 1 / 240);

  const ox = Math.min(16, Math.abs(s1.x - s2.x) * 240 / 300), oy = Math.min(16, Math.abs(s1.y - s2.y) * 240 / 300);
  if (ox > 0.6 || oy > 0.6) { gObj.setAttribute('stdDeviation', `${(ox / c.z).toFixed(2)} ${(oy / c.z).toFixed(2)}`); objEl.style.filter = 'url(#fObj)'; } else objEl.style.filter = 'none';

  const Q = curAt(t);
  const s = (1.3 / Math.sqrt(c.z)) * (1 - 0.16 * pressAt(t));
  curEl.style.transform = `translate(${Q.x - 2 * s}px,${Q.y - 2 * s}px) scale(${s})`;
