<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>KROOPY — showreel 60 s (1080×1920 · 120 BPM)</title>
<!--
  KROOPY · 60 s showreel. Through-line object: Kroo, the lime sphere with two eyes that lives on KROOPY's
  home screen and in KROOPY AI. Every style is computed from time inside window.seek(t): no CSS animations,
  no timers, no state carried between frames. One typeface (Inter), one accent (lime) on Kroo and the key word.
-->
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url(data:font/woff2;base64,__INTER_B64__) format('woff2'); }
:root {
  --ink: #0b0f14; --lime: #d4f53c; --surf: #11171f; --surf2: #161d27; --surf3: #1c2431;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --t1: #ffffff; --t2: rgba(229,237,248,.68); --t3: rgba(229,237,248,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: var(--ink); overflow: hidden; }
body { font-family: 'Inter', sans-serif; color: var(--t1); -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01', 'cv11'; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
#cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; isolation: isolate; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.bg { position: absolute; left: -2600px; top: -2600px; width: 6280px; height: 7120px; background: var(--ink); }
.abs { position: absolute; }
.m { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .14em; margin: 0 -.04em -.14em; }
.m > span { display: inline-block; }
.lime { color: var(--lime); }
.ico svg { width: 100%; height: 100%; display: block; }
.panel { position: absolute; background: var(--surf); border: 2px solid var(--line); }
.eyebrow { font-size: 28px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--t3); }
.title { font-weight: 800; letter-spacing: -.045em; line-height: 1; }
.cap { position: absolute; left: 90px; width: 900px; font-size: 104px; font-weight: 800; letter-spacing: -.04em; line-height: 1.02; }
.chip { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px; border-radius: 27px; border: 2px solid var(--line2); font-size: 26px; font-weight: 600; color: var(--t2); white-space: nowrap; }
/* through-line: Kroo */
#blob { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#blob > div, #body > div { position: absolute; }
.ear, #body { background: var(--lime); border-style: solid; border-color: var(--ink); }
.ear { border-radius: 50%; }
.eye { border-style: solid; border-color: var(--ink); border-radius: 9999px; background: transparent; }
#bIcon { color: var(--ink); }
#bLabel { color: var(--ink); font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 14px; }
#bLabel .kbd { font-size: .62em; padding: 4px 12px; border-radius: 10px; background: rgba(11,15,20,.14); font-weight: 700; }
/* cursor (KROOPY's own: dot + lagging ring) */
#cursor, #cRing { position: absolute; left: 0; top: 0; }
#cDot { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; }
#cRing { width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.78); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="fCam0" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam0" stdDeviation="0 0" /></filter>
  <filter id="fCam1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam1" stdDeviation="0 0" /></filter>
  <filter id="fCam2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam2" stdDeviation="0 0" /></filter>
  <filter id="fCam3" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam3" stdDeviation="0 0" /></filter>
  <filter id="fCam4" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam4" stdDeviation="0 0" /></filter>
  <filter id="fCam5" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="gCam5" stdDeviation="0 0" /></filter>
  <filter id="fBlob" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur id="gBlob" stdDeviation="0 0" /></filter>
  <filter id="fCur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur id="gCur" stdDeviation="0 0" /></filter>
  <filter id="fDrag" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur id="gDrag" stdDeviation="0 0" /></filter>
</svg>
<div id="stage">
  <div id="cam"></div>
  <div id="blob">
    <div class="ear" id="earL"></div><div class="ear" id="earR"></div>
    <div id="body"><div class="eye" id="eyeL"></div><div class="eye" id="eyeR"></div><div id="bIcon" class="ico"></div><div id="bLabel"></div></div>
  </div>
  <div id="cRing"></div>
  <div id="cursor"><div id="cDot"></div></div>
</div>
<script>
/* ───────────── time, easing ───────────── */
const W = 1080, H = 1920, CX = 540, CY = 960, BPM = 120, BEAT = 60 / BPM, DUR = 60;
const ICONS = __ICONS_JSON__;
const WM = 'data:image/png;base64,__WM_B64__';
const tb = (b) => b * BEAT;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
/** Damped spring 0 → 1 (z < 1: a small overshoot, never bouncy). */
function spring(dt, w = 15, z = 0.82) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const S = (t, b, w = 15, z = 0.82) => spring(t - tb(b), w, z);
const EO = (t, b, d = 0.9) => expoOut(clamp((t - tb(b)) / tb(d)));
const EIO = (t, b, d = 1) => expoInOut(clamp((t - tb(b)) / tb(d)));
const EI = (t, b, d = 0.6) => expoIn(clamp((t - tb(b)) / tb(d)));
/** A press: dips fast, springs back. */
const press = (t, b) => { const d = t - tb(b); if (d < 0 || d > 0.7) return 0; return d < 0.06 ? d / 0.06 : 1 - spring(d - 0.06, 22, 0.7); };

/* ───────────── scenes & the camera ───────────── */
const SB = [0, 8, 32, 52, 72, 104, 120]; // scene boundaries (beats)
const sceneAt = (b) => { for (let i = SB.length - 2; i >= 0; i--) if (b >= SB[i]) return i; return 0; };
/** Global push: 1.00 → 1.04 inside every scene; each scene starts at the zoom the last one ended on. */
const G = (t) => { const b = t / BEAT, i = sceneAt(b), p = clamp((b - SB[i]) / (SB[i + 1] - SB[i])); return Math.pow(1.04, i + p); };
const K = (i) => Math.pow(1.04, -i); // each scene's content scale, so it starts at 1.00 on screen
/** Camera keys per scene: focus (layout coords of that scene) and a zoom multiplier, eased (screen-studio style). */
const CAMK = [
  [{ b: 0, x: 540, y: 930, m: 1 }],
  [{ b: 7.6, x: 540, y: 900, m: 1 }, { b: 12.4, x: 400, y: 640, m: 1.34, d: 1.3 }, { b: 14.8, x: 540, y: 1190, m: 1.1, d: 1 }, { b: 17.15, x: 540, y: 980, m: 1.1, d: 0.85 }, { b: 18.1, x: 540, y: 1010, m: 1.15, d: 1.1 },
    { b: 22.6, x: 640, y: 1300, m: 1.22, d: 1 }, { b: 24.3, x: 540, y: 880, m: 1.02, d: 1.1 }, { b: 26.6, x: 540, y: 1080, m: 0.98, d: 2.5 }],
  [{ b: 31.4, x: 540, y: 760, m: 1.06 }, { b: 33.6, x: 540, y: 780, m: 1.14, d: 1 }, { b: 42.6, x: 520, y: 1100, m: 1, d: 1.8 }, { b: 49.4, x: 440, y: 1060, m: 1.08, d: 2.2 }], // + the card's travel
  [{ b: 51.4, x: 470, y: 690, m: 1.12 }, { b: 55, x: 430, y: 720, m: 1.26, d: 1.4 }, { b: 58.8, x: 540, y: 1260, m: 1.16, d: 1.2 }, { b: 62.6, x: 540, y: 1200, m: 0.98, d: 1.5 }],
  [{ b: 71.4, x: 540, y: 1100, m: 1 }, { b: 72.8, x: 560, y: 1590, m: 1.3, d: 1 }, { b: 78.4, x: 540, y: 820, m: 1.12, d: 1.2 }, { b: 85.8, x: 540, y: 1180, m: 1.1, d: 1.1 },
    { b: 91.2, x: 330, y: 1370, m: 1.42, d: 1.6 }, { b: 93, x: 330, y: 1380, m: 1.6, d: 3 }, { b: 96.1, x: 540, y: 1700, m: 1.12, d: 1.2 }, { b: 99.2, x: 540, y: 1880, m: 1.15, d: 2 }],
  [{ b: 103.6, x: 540, y: 960, m: 1 }],
];
function camKey(i, t) {
  const ks = CAMK[i];
  let x = ks[0].x, y = ks[0].y, m = ks[0].m;
  for (let k = 1; k < ks.length; k++) {
    const p = EIO(t, ks[k].b, ks[k].d || 1);
    if (p <= 0) break;
    x = lerp(x, ks[k].x, p); y = lerp(y, ks[k].y, p); m = lerp(m, ks[k].m, p);
  }
  return { x, y, m };
}
/** Camera of scene i at t: every scene keeps its own framing, so a scene that is still on screen during a
    transition never jumps. Zoom = the global push (continuous across cuts) × the scene's own zoom. */
function camera(t, i = sceneAt(t / BEAT)) {
  const f = camKey(i, t);
  if (i === 2) { const c = cardMove(Math.max(0, t - 0.1)).x; f.x += c > 4 * COLW ? 4 * COLW + (c - 4 * COLW) * 0.55 : c; } // the board pans with the dragged card
  return { i, Z: G(t) * K(i) * f.m, fx: f.x, fy: f.y, m: f.m };
}
/** Screen position of a layout point of scene i at time t. */
function scr(i, x, y, t, cam = camera(t, i)) { return [CX + cam.Z * (x - cam.fx), CY + cam.Z * (y - cam.fy)]; }
/** Screen scale of scene i at time t. */
const scl = (i, t, cam = camera(t, i)) => cam.Z;
/** Layout point of scene i under a screen point. */
function lay(i, sx, sy, t, cam = camera(t, i)) { return [cam.fx + (sx - CX) / cam.Z, cam.fy + (sy - CY) / cam.Z]; }

/* ───────────── DOM building ───────────── */
const $ = (id) => document.getElementById(id);
const icon = (name) => ICONS[name] || '';
function el(parent, cls, style = {}, html = '', id) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (id) e.id = id;
  Object.assign(e.style, style);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
/** Words wrapped in masks: each word rises from behind its own edge. */
const words = (text, keyWord) => text.split(' ').map((w) => `<span class="m"><span class="wd${keyWord && w.replace(/[.,]/g, '') === keyWord ? ' lime' : ''}">${w}</span></span>`).join(' ');
const A = {}; // anchors: layout rects measured at runtime
const SC = [];

function build() {
  const cam = $('cam');
  for (let i = 0; i < 6; i++) { const s = el(cam, 'scene', {}, '', 's' + i); el(s, 'bg'); SC.push(s); }

  /* S0 · hook */
  const h = el(SC[0], 'abs', { left: '90px', top: '640px', width: '960px' });
  h.innerHTML = `<div class="title" style="font-size:150px">${words('Mil ideas.')}</div>
    <div class="title" style="font-size:150px;margin-top:22px"><span class="m"><span class="wd">Cero</span></span> <span class="m"><span class="wd">vídeos</span></span><span id="hDot" style="display:inline-block;width:.2em;height:.2em;margin-left:.05em"></span></div>`;
  h.id = 'hook';

  /* S1 · home → quick create → new idea → My Ideas */
  const s1 = SC[1];
  el(s1, 'abs', { left: '780px', top: '200px', width: '200px', height: '200px' }, '', 'aOvKroo');
  el(s1, 'abs eyebrow', { left: '90px', top: '430px' }, '<span class="m"><span class="wd">Viernes · 27 noviembre 2026</span></span>', 'ovEye');
  el(s1, 'abs title', { left: '90px', top: '478px', fontSize: '124px' }, words('Buenas noches.'), 'ovHi');
  el(s1, 'abs', { left: '90px', top: '640px', fontSize: '44px', color: 'var(--t2)', fontWeight: 500 }, words('Hoy: 5 tareas, 1 grabación.'), 'ovSub');
  el(s1, 'abs', { left: '90px', top: '740px', width: '540px', height: '124px' }, '', 'aOvQuick');
  // sheet «Crear»
  const sh = el(s1, 'panel', { left: '30px', top: '880px', width: '1020px', height: '1240px', borderRadius: '74px 74px 0 0', background: 'var(--surf2)', borderColor: 'var(--line2)' }, '', 'sheet');
  el(sh, 'abs', { left: '450px', top: '22px', width: '120px', height: '10px', borderRadius: '5px', background: 'var(--line2)' });
  el(sh, 'abs title', { left: '70px', top: '74px', fontSize: '76px' }, 'Crear');
  el(sh, 'abs', { left: '70px', top: '170px', fontSize: '38px', color: 'var(--t2)' }, 'Añade lo que sea, desde donde sea.');
  const tiles = [['Lightbulb', 'Nueva idea', 'Atrápala antes de que se escape'], ['Clapperboard', 'Nuevo vídeo', 'Empieza una producción'], ['ListPlus', 'Nueva tarea', 'Personal o profesional'], ['CalendarPlus', 'Nuevo evento', 'Grabación, edición, reunión…']];
  tiles.forEach(([ic, t1, t2], j) => {
    const x = 70 + (j % 2) * 455, y = 270 + Math.floor(j / 2) * 250;
    const tile = el(sh, 'abs', { left: x + 'px', top: y + 'px', width: '425px', height: '220px', borderRadius: '44px', background: 'var(--surf)', border: '2px solid var(--line)' }, '', 'tile' + j);
    el(tile, 'abs ico', { left: '32px', top: '32px', width: '100px', height: '100px', borderRadius: '28px', background: 'rgba(255,255,255,.06)', padding: '28px', color: '#fff' }, icon(ic), j === 0 ? 'aTileIdea' : undefined);
    el(tile, 'abs', { left: '32px', top: '150px', width: '370px', fontSize: '36px', fontWeight: 700 }, t1);
    el(tile, 'abs', { left: '154px', top: '44px', width: '240px', fontSize: '27px', lineHeight: '1.3', color: 'var(--t3)' }, t2);
  });
  // form «Nueva idea»
  const fm = el(s1, 'panel', { left: '40px', top: '700px', width: '1000px', height: '820px', borderRadius: '64px', background: 'var(--surf2)', borderColor: 'var(--line2)' }, '', 'form');
  const fin = el(fm, 'abs', { left: 0, top: 0, width: '1000px', height: '820px' }, '', 'formIn');
  el(fin, 'abs', { left: '60px', top: '60px', width: '110px', height: '110px' }, '', 'aFormIcon');
  el(fin, 'abs title', { left: '200px', top: '82px', fontSize: '66px' }, 'Nueva idea');
  el(fin, 'abs', { left: '60px', top: '226px', fontSize: '32px', fontWeight: 600, color: 'var(--t3)' }, 'Título');
  const inp = el(fin, 'abs', { left: '60px', top: '280px', width: '880px', height: '132px', borderRadius: '32px', border: '2px solid var(--line2)', background: 'rgba(255,255,255,.03)', overflow: 'hidden' }, '', 'input');
  el(inp, 'abs', { left: '36px', top: '38px', fontSize: '44px', color: 'var(--t3)', whiteSpace: 'nowrap' }, 'p. ej. 24 h en Madrid con 100 €', 'inPh');
  el(inp, 'abs', { left: '36px', top: '38px', fontSize: '44px', fontWeight: 600, whiteSpace: 'nowrap' }, '', 'inTx');
  el(inp, 'abs', { left: '36px', top: '32px', width: '4px', height: '66px', background: '#fff' }, '', 'caret');
  el(fin, 'abs', { left: '60px', top: '460px', fontSize: '32px', fontWeight: 600, color: 'var(--t3)' }, 'Categoría');
  el(fin, 'abs', { left: '60px', top: '512px', display: 'flex', gap: '16px' }, `<span class="chip" id="catOn">Vlogs</span><span class="chip">Estilo de vida</span><span class="chip">Unboxings</span>`);
  el(fin, 'abs', { left: '60px', top: '650px', width: '420px', height: '116px', borderRadius: '58px', border: '2px solid var(--line2)', display: 'grid', placeItems: 'center', fontSize: '34px', fontWeight: 700, color: 'var(--t2)' }, 'Guardar y convertir');
  el(fin, 'abs', { left: '510px', top: '650px', width: '430px', height: '116px', borderRadius: '58px', border: '2px solid var(--line2)' }, '', 'aFormSave');
  // My Ideas
  el(s1, 'abs title', { left: '90px', top: '300px', fontSize: '96px' }, words('Mis ideas'), 'idTitle');
  const cards = [['Vlogs', 'Vlog: un día creando contenido', 'Lo que planeo frente a lo que pasa de verdad.'], ['Unboxings', 'Unboxing: mi setup de escritorio', 'Luz, micro y brazo: lo que cuesta de verdad.'], ['Estilo de vida', 'Mañanas de creador', 'Rutina real, sin filtros.']];
  cards.forEach(([c, t1, t2], j) => {
    const card = el(s1, 'panel', { left: '90px', top: 450 + j * 300 + 'px', width: '900px', height: '270px', borderRadius: '52px' }, '', 'idCard' + j);
    el(card, 'abs eyebrow', { left: '44px', top: '44px', fontSize: '24px' }, c);
    el(card, 'abs title', { left: '44px', top: '92px', fontSize: '50px', width: '740px' }, t1);
    el(card, 'abs', { left: '44px', top: '172px', fontSize: '32px', color: 'var(--t2)' }, t2);
    if (j > 0) el(card, 'abs ico', { left: '808px', top: '40px', width: '48px', height: '48px', color: 'var(--t3)' }, icon('Star'));
    else el(card, 'abs', { left: '800px', top: '32px', width: '64px', height: '64px' }, '', 'aIdeaStar');
  });
  el(s1, 'cap', { top: '1520px' }, words('Atrapa cada idea.', 'idea'), 'cap1');

  /* S2 · Content Studio board */
  const s2 = SC[2];
  el(s2, 'abs title', { left: '90px', top: '250px', fontSize: '96px' }, words('Content Studio'), 'stTitle');
  const cols = ['Idea', 'Guion', 'Grabación', 'Edición', 'Programado', 'Publicado'];
  cols.forEach((n, j) => {
    const col = el(s2, 'panel', { left: 90 + j * 596 + 'px', top: '420px', width: '560px', height: '900px', borderRadius: '56px' }, '', 'col' + j);
    el(col, 'abs', { left: '40px', top: '48px', width: '20px', height: '20px', borderRadius: '50%', background: 'var(--t3)' });
    el(col, 'abs', { left: '76px', top: '34px', fontSize: '40px', fontWeight: 700 }, n);
    el(col, 'abs', { right: '36px', top: '30px', minWidth: '56px', height: '52px', borderRadius: '26px', background: 'rgba(255,255,255,.06)', display: 'grid', placeItems: 'center', fontSize: '28px', fontWeight: 700, color: 'var(--t2)' }, '<span id="cnt' + j + '">0</span>');
  });
  const other = [[2, 'Q&A: cómo empecé a crear', 'YouTube'], [3, 'Unboxing: mi setup de escritorio', 'Instagram']];
  other.forEach(([j, t1, p]) => {
    const c = el(s2, 'panel', { left: 90 + j * 596 + 28 + 'px', top: '880px', width: '504px', height: '250px', borderRadius: '40px', background: 'var(--surf2)' });
    el(c, 'abs title', { left: '36px', top: '40px', fontSize: '38px', width: '430px', lineHeight: '1.1' }, t1);
    el(c, 'abs', { left: '36px', top: '160px' }, `<span class="chip">${p}</span>`);
  });
  const sc = el(s2, 'panel', { left: '118px', top: '530px', width: '504px', height: '330px', borderRadius: '40px', background: 'var(--surf2)', borderColor: 'var(--line2)' }, '', 'stCard');
  el(sc, 'abs eyebrow', { left: '36px', top: '36px', fontSize: '22px' }, 'Vlogs');
  el(sc, 'abs title', { left: '36px', top: '78px', fontSize: '42px', width: '430px', lineHeight: '1.08' }, 'Vlog: un día creando contenido');
  el(sc, 'abs', { left: '36px', top: '190px', display: 'flex', gap: '12px' }, `<span class="chip">TikTok</span><span class="chip" id="stDate" style="color:#fff;border-color:rgba(255,255,255,.4)">Publicar · 5 dic</span>`);
  el(sc, 'abs', { left: '36px', top: '282px', width: '432px', height: '14px', borderRadius: '7px', background: 'rgba(255,255,255,.08)' }, '', 'aStTrack');
  el(s2, 'cap', { left: '2740px', top: '1430px' }, words('Del guion a publicado.', 'publicado'), 'cap2');

  /* S3 · calendar + My day */
  const s3 = SC[3];
  el(s3, 'abs title', { left: '90px', top: '250px', fontSize: '96px' }, words('Calendario'), 'caTitle');
  el(s3, 'abs title', { left: '90px', top: '390px', fontSize: '52px' }, words('noviembre 2026'), 'caMonth');
  const cal = el(s3, 'abs', { left: '90px', top: '480px', width: '900px', height: '480px' }, '', 'cal');
  'LMMJVSD'.split('').forEach((d, j) => el(cal, 'abs', { left: j * 128.6 + 'px', top: '0px', width: '128.6px', textAlign: 'center', fontSize: '28px', fontWeight: 700, color: 'var(--t3)' }, d));
  const days = [[23, 24, 25, 26, 27, 28, 29], [30, 1, 2, 3, 4, 5, 6]];
  days.forEach((row, r) => row.forEach((d, j) => {

/** Anchors in layout coordinates, measured with every animated transform at rest (no hard-coded positions). */
function measure() {
  $('cam').style.transform = 'none';
  SC.forEach((s) => { s.style.transform = 'none'; s.style.visibility = 'visible'; s.style.clipPath = 'none'; });
  document.querySelectorAll('[id^="a"]').forEach((e) => {
    if (!/^a[A-Z]/.test(e.id)) return;
    const r = e.getBoundingClientRect();
    A[e.id.slice(1)] = { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
  });
  const d = $('hDot').getBoundingClientRect();
  A.HookDot = { x: d.left + d.width / 2, y: d.top + d.height / 2, w: d.width, h: d.height };
  for (const id of ['catOn', 'day1_1', 'day0_4', 'wk1', 'wk3', 'aiRow0', 'aiRow1', 'input', 'tile0', 'idCard0', 'form', 'stCard', 'aiComp', 'aiSend', 'calChip', 'aiBubble']) {

}

const COLW = 596;
const DROPS = [[33.7, 35, 1], [35.5, 37, 2], [37.5, 39, 3], [39.5, 41, 4], [47.6, 49, 5]]; // [lift, drop, column]
function cardMove(t) {
  let x = 0, lift = 0;
  for (const [l, d, c] of DROPS) {
    const p = EIO(t, l + 0.2, d - l - 0.2);
    x = lerp(x, c * COLW, p);
    lift = Math.max(lift, clamp((t - tb(l)) / 0.12) * (1 - clamp((t - tb(d)) / 0.2)));
  }
  const settle = DROPS.reduce((s, [, d]) => s + (t > tb(d) ? 1 - spring(t - tb(d), 18, 0.7) : 0) * (t < tb(d) + 0.6 ? 1 : 0), 0);
  return { x, y: -14 * lift, lift, rot: -2.2 * lift, settle };
}
const PROG = [0.12, 0.3, 0.5, 0.7, 0.86, 1];
function progress(t) {
  let p = PROG[0];
  DROPS.forEach(([, d, c]) => { p = lerp(p, PROG[c], S(t, d / 1, 14, 0.8)); });
  return p;
}
const CAL_DRAG = [55.7, 58.1];
function chipMove(t) {
  const from = A.day0_4, to = A.day1_1;

  const lift = clamp((t - tb(CAL_DRAG[0])) / 0.12) * (1 - clamp((t - tb(CAL_DRAG[1])) / 0.2));
  return { dx: (to.x - from.x) * p, dy: (to.y - from.y) * p - 10 * lift, lift };
}

  const cam = camera(t, i), [x, y] = scr(i, a.x + (o.dx || 0), a.y + (o.dy || 0), t, cam), s = scl(i, t, cam);
  const w = (o.w ?? a.w) * s, h = (o.h ?? a.h) * s;
  return { x, y, w, h, r: (o.r ?? Math.min(a.w, a.h) / 2) * s, bw: 0, ears: 0, eyes: 0, ring: 0, blink: 0, lx: 0, ly: 0, rot: 0, icon: o.icon ?? null, iconP: o.iconP ?? 0, label: o.label ?? '', labelP: o.labelP ?? 0, fs: (o.fs ?? 40) * s };
}

  const o = {};

  return o;
}
/** Kroo seen from a docked shape: grows eyes, ears and its outline back. */
const toKroo = (p, x, y, D, o) => kroo(x, y, D, o);
