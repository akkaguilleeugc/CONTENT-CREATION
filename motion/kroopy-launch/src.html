<script>
'use strict';
const ICONS = __ICONS_JSON__;
const OO_SRC = 'data:image/png;base64,__OO_B64__';

/* ───────────────────────── constants & time ───────────────────────── */
const W = 1080, H = 1920, K = 2.3, PX = 91, PY = -10;
const BEAT = 0.5, DUR = 80, LIME = '#D4F53C', INK = '#0B0F14';
const tb = (b) => b * BEAT;
const SCENES = [0, 8, 28, 56, 80, 108, 128, 140, 160]; // hook · capture · produce · plan · track · build · payoff · end
const HITS = [4, 8, 28, 56, 80, 108, 128, 140];

/* ───────────────────────── easing (pure functions of time) ───────────────────────── */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
/** Damped spring step response. ζ = 0.8 → ~1.5% overshoot (the "small overshoot" ceiling). */
function spring(dt, w = 16, z = 0.8) {
  if (dt <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const SP = (t, b, w = 16, z = 0.8) => spring(t - tb(b), w, z);
const EX = (t, b, d = 0.45) => expoOut(clamp((t - tb(b)) / d));
const EXt = (t, t0, d = 0.45) => expoOut(clamp((t - t0) / d));
/** A press: 0 → 1 → 0 within ~0.25s, peaking 60ms after tc. */
const pulse = (dt, k = 0.06) => (dt < 0 ? 0 : (dt / k) * Math.exp(1 - dt / k));

/* ───────────────────────── small DOM helpers ───────────────────────── */

function uiRect(el) {

/** World-space rect, centre based: {x, y, w, h}. */
function wr(sel, r = null) {
  const el = typeof sel === 'string' ? $(sel) : sel;
  const u = uiRect(el);
  return { x: PX + K * (u.x + u.w / 2), y: PY + K * (u.y + u.h / 2), w: K * u.w, h: K * u.h, r: r == null ? null : r * K };
}
const U = (...rs) => { const x0 = Math.min(...rs.map((r) => r.x - r.w / 2)), x1 = Math.max(...rs.map((r) => r.x + r.w / 2)), y0 = Math.min(...rs.map((r) => r.y - r.h / 2)), y1 = Math.max(...rs.map((r) => r.y + r.h / 2)); return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 }; };

const F = (r, fill = 0.88, o = {}) => ({ cx: r.x + (o.dx || 0), cy: r.y + (o.dy || 0), z: Math.min((W * fill) / r.w, (H * fill) / r.h, o.max || 9) });

const obj = (b, T, o = {}) => OBJ.push({ t0: tb(b) + (o.dt || 0), T, w: o.w || 16, z: o.z ?? 0.8 });

const cur = (b, T, o = {}) => CUR.push({ t0: tb(b) + (o.dt || 0), T, w: o.w || 15, z: o.z ?? 0.86 });
const click = (b, dt = 0) => CLICKS.push(tb(b) + dt);

const sceneS = (t) => { const b = t / BEAT; for (let i = 0; i < SCENES.length - 1; i++) if (b < SCENES[i + 1]) return i + (b - SCENES[i]) / (SCENES[i + 1] - SCENES[i]); return SCENES.length - 1; };
const PUSH = (t) => Math.pow(1.04, sceneS(t));

/** Camera: blended expo moves; on top, a constant push of 1.0 → 1.04 per scene that carries over between scenes. */
function camAt(t) {
  let cx = 540, cy = 960, lz = 0;
  for (const m of CAM) {
    if (t < m.t0) break;
    const p = m.ease(clamp((t - m.t0) / m.d));
    const T = typeof m.T === 'function' ? m.T(t) : m.T;
    const zt = Math.log(T.z / PUSH(m.t0 + m.d));
    cx += (T.cx - cx) * p; cy += (T.cy - cy) * p; lz += (zt - lz) * p;
  }

}
const toWorld = (c, sx, sy) => ({ x: c.cx + (sx - 540) / c.z, y: c.cy + (sy - 960) / c.z });
const toScreen = (c, x, y) => ({ x: (x - c.cx) * c.z + 540, y: (y - c.cy) * c.z + 960 });

    const s = spring(t - m.t0, m.w, m.z);
    const T = typeof m.T === 'function' ? m.T(t) : m.T;
    for (const k in T) if (T[k] != null) P[k] += (T[k] - P[k]) * s;
  }

}

const typedN = (t) => Math.round(clamp((t - tb(12) - 0.04) / 1.34) * A.typed.length);

/* ───────────────────────── per-frame rendering ───────────────────────── */
const worldEl = $('#world'), sceneEl = $('#scene'), curEl = $('#cursor');
const gObj = $('#gObj'), gCur = $('#gCur'), gScene = $('#gScene'), gIn = $('#gIn'), gOut = $('#gOut');

/** Clip `el` (UI rect E) from the object's rect (p=0) to its full self (p=1). */
function clipFromObj(el, P, p, rFull = 18) {
  const E = el._r || (el._r = uiRect(el));
  if (p >= 1) { el.style.clipPath = 'none'; return; }
  if (p <= 0.002) { el.style.clipPath = 'inset(50% 50% 50% 50%)'; return; }
  const ox = (P.x - P.w / 2 - PX) / K - E.x, oy = (P.y - P.h / 2 - PY) / K - E.y, ow = P.w / K, oh = P.h / K;
  const q = 1 - Math.max(0, p);
  const top = oy * q, left = ox * q, right = (E.w - ox - ow) * q, bottom = (E.h - oy - oh) * q;
  el.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px round ${lerp(P.r / K, rFull, p)}px)`;
}
/** Generic unfold/fold of a layer element around the object: in at bIn, out at bOut. */
function around(el, t, P, bIn, bOut, o = {}) {
  const inP = o.inNow ? 1 : expoOut(clamp((t - tb(bIn) - (o.dIn || 0)) / (o.durIn || 0.55)));
  const outP = bOut == null ? 0 : expoInOut(clamp((t - tb(bOut) - (o.dOut || 0)) / (o.durOut || 0.38)));
  const p = Math.min(inP, 1 - outP);
  const on = t >= tb(bIn) + (o.dIn || 0) && (bOut == null || p > 0.002);
  show(el, on);
  if (on) clipFromObj(el, o.P || P, p, o.r ?? 18);
  return on ? p : 0;
}
function maskSwap(a, b, t, t0, dist = 110) {
  const p = spring(t - t0, 18, 0.82);
  a.style.transform = `translateY(${-dist * clamp(p, 0, 1.2)}%)`;
  b.style.transform = `translateY(${dist * (1 - p)}%)`;
}
function rise(el, t, t0, dist = 110) { el.style.transform = `translateY(${dist * (1 - spring(t - t0, 17, 0.82))}%)`; }
const growS = (t, t0, w = 17) => clamp(spring(t - t0, w, 0.8), 0, 1.2);

function renderStatements(t, c) {
  let vIn = 0, vOut = 0;
  for (const s of STM) {
    const t0 = tb(s.beats[0]) - 0.08, t1 = tb(s.exit) + s.exitDt + 0.7;
    const on = t >= t0 && t < t1;
    show(s.el, on);
    if (!on) continue;
    const p = placeOf(s);
    s.el.style.transform = `translate(${p.left}px,${p.top}px) scale(${p.sc})`;
    s.words.forEach((w, i) => {
      const tw = tb(s.beats[i]);
      const yIn = (tt) => 118 * (1 - spring(tt - tw, 17, 0.82));
      let y = yIn(t);
      if (s.knock != null && i === s.knock) {
        const tk = tb(s.knock) + 0.2;
        if (t >= tk) y = lerp(yIn(tk), 130, spring(t - tk, 20, 0.8));
      }
      const te = tb(s.exit) + s.exitDt + i * s.exitStagger;
      const pe = clamp((t - te) / 0.32);
      const outE = (q) => Math.pow(q, 2.2);
      if (pe > 0) y = y - 125 * outE(pe);
      w.style.transform = `translateY(${y}%)`;
      // vertical speed → motion blur (screen px per second)
      const fs = parseFloat(s.el.style.fontSize) || 200;
      const dIn = (yIn(t) - yIn(t - 1 / 240)) * 240 * fs * 0.01;
      const dOut = pe > 0 && pe < 1 ? (125 * (outE(pe) - outE(clamp(pe - 1 / 240 / 0.32))) * 240 * fs * 0.01) : 0;
      const moving = Math.abs(dIn) > 600 ? 'in' : dOut > 600 ? 'out' : '';
      w.style.filter = moving === 'in' ? 'url(#fIn)' : moving === 'out' ? 'url(#fOut)' : 'none';
      if (moving === 'in') vIn = Math.max(vIn, Math.abs(dIn));
      if (moving === 'out') vOut = Math.max(vOut, dOut);
    });
  }
  gIn.setAttribute('stdDeviation', `0 ${Math.min(14, vIn / 380).toFixed(2)}`);
  gOut.setAttribute('stdDeviation', `0 ${Math.min(14, vOut / 380).toFixed(2)}`);
}

function seek(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const c = camAt(t);
  const P = objAt(t);
  const b = t / BEAT;

  /* camera + camera-speed blur on the scene (object & cursor carry their own) */
  worldEl.style.transform = `translate(540px,960px) scale(${c.z}) translate(${-c.cx}px,${-c.cy}px)`;
  const c2 = camAt(t - 1 / 240);
  const vx = (c.cx - c2.cx) * c.z * 240, vy = (c.cy - c2.cy) * c.z * 240, vz = Math.abs(Math.log(c.z / c2.z)) * 240 * 700;
  const bx = Math.min(12, Math.abs(vx) / 480 + vz / 520), by = Math.min(12, Math.abs(vy) / 480 + vz / 520);
  if (bx > 0.7 || by > 0.7) { gScene.setAttribute('stdDeviation', `${(bx / c.z).toFixed(2)} ${(by / c.z).toFixed(2)}`); sceneEl.style.filter = 'url(#fScene)'; } else sceneEl.style.filter = 'none';

  /* ── tab bar (hook + payoff) ── */
  const tab = $('#tabbar');
  if (b < 9) {
    show(tab, true);
    tab.style.transform = `translateY(${A.tabY(t)}px)`;
    tab.style.clipPath = 'none';
  } else if (b >= 124) {
    show(tab, b < 132);
    const up = (1 - SP(t, 124.6, 12, 0.86)) * 190;
    tab.style.transform = `translateY(${up}px)`;
    const out = expoInOut(clamp((t - tb(130.6)) / 0.5));
    tab.style.clipPath = out > 0 ? `inset(${34 * out}px ${183 * out}px ${34 * out}px ${183 * out}px round 30px)` : 'none';
  } else show(tab, false);

  /* ── Create sheet: unfolds out of the + at b7, folds into the New idea tile at b11 ── */
  {
    const el = $('#Lcreate'), cs = $('#cs');
    show(el, b >= 7 && b < 12);

    else { $('#gNumA').textContent = stg + 1; $('#gNumA').style.transform = 'none'; $('#gNumB').style.transform = 'translateY(110%)'; }
    // calendar chip time 19:00 → 18:00

    const P2 = objAt(t - 1 / 240), c3 = camAt(t - 1 / 240);
    const s1 = toScreen(c, x, y), s2 = toScreen(c3, P2.x, P2.y);
    const ovx = (s1.x - s2.x) * 240, ovy = (s1.y - s2.y) * 240;
    const ox = Math.min(16, Math.abs(ovx) / 300), oy = Math.min(16, Math.abs(ovy) / 300);
    if (ox > 0.6 || oy > 0.6) { gObj.setAttribute('stdDeviation', `${(ox / c.z).toFixed(2)} ${(oy / c.z).toFixed(2)}`); objEl.style.filter = 'url(#fObj)'; } else objEl.style.filter = 'none';
  }

  /* ── the cursor ── */
  {
    const Q = curAt(t);
    const s = (1.35 / Math.sqrt(c.z)) * (1 - 0.16 * pressAt(t));
    curEl.style.transform = `translate(${Q.x - 2 * s}px,${Q.y - 2 * s}px) scale(${s})`;
    const Q2 = curAt(t - 1 / 240), c4 = camAt(t - 1 / 240);
    const a1 = toScreen(c, Q.x, Q.y), a2 = toScreen(c4, Q2.x, Q2.y);
    const cvx = Math.abs(a1.x - a2.x) * 240, cvy = Math.abs(a1.y - a2.y) * 240;
    const cx = Math.min(12, cvx / 260), cy = Math.min(12, cvy / 260);
    if (cx > 0.6 || cy > 0.6) { gCur.setAttribute('stdDeviation', `${(cx / c.z / s).toFixed(2)} ${(cy / c.z / s).toFixed(2)}`); curEl.style.filter = 'url(#fCur)'; } else curEl.style.filter = 'none';
  }
}

/* ───────────────────────── soundtrack (Web Audio, offline) ───────────────────────── */
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[53, 56, 60, 65], [53, 56, 61, 65], [51, 56, 60, 63], [51, 55, 58, 63]]; // Fm · Db/F · Ab/Eb · Eb
const ROOTS = [41, 37, 44, 39];
async function renderAudio() {
  const SR = 48000;
  const ctx = new OfflineAudioContext(2, DUR * SR, SR);
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296) * 2 - 1;
  const nbuf = ctx.createBuffer(1, SR * 3, SR); { const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const ir = ctx.createBuffer(2, SR * 2.2, SR); for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = rnd() * Math.pow(1 - i / d.length, 3.2) * 0.6; }
  const master = ctx.createGain(); master.gain.value = 0.7;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.14;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = ir; const verbOut = ctx.createGain(); verbOut.gain.value = 0.28; verb.connect(verbOut); verbOut.connect(master);
  const drums = ctx.createGain(); drums.connect(master);
  const music = ctx.createGain(); music.connect(master);
  // sidechain feel: the music bus ducks under every kick
  music.gain.setValueAtTime(1, 0);
  for (let b = 0; b < 160; b++) { const t = tb(b); music.gain.setValueAtTime(0.32, t); music.gain.setTargetAtTime(1, t + 0.02, 0.09); }

  const env = (g, t, a, peak, d, floor = 0.0001) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(floor, t + a + d); };
  function noise(t, d, o = {}) {
    const src = ctx.createBufferSource(); src.buffer = nbuf; const f = ctx.createBiquadFilter(); f.type = o.type || 'highpass'; f.frequency.value = o.f || 6000; f.Q.value = o.q || 0.7;
    if (o.f1) { f.frequency.setValueAtTime(o.f, t); f.frequency.exponentialRampToValueAtTime(o.f1, t + d); }
    const g = ctx.createGain(); const pan = ctx.createStereoPanner(); pan.pan.value = o.pan || 0;
    src.connect(f); f.connect(g); g.connect(pan); pan.connect(o.dest || drums);
    if (o.send) { const s = ctx.createGain(); s.gain.value = o.send; pan.connect(s); s.connect(verb); }
    if (o.rise) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain, t + d - 0.01); g.gain.linearRampToValueAtTime(0, t + d); }
    else env(g, t, o.a || 0.001, o.gain || 0.3, d);

    const osc = ctx.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.fd || d));

    let node = osc;
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(o.lp, t); if (o.lp1) f.frequency.exponentialRampToValueAtTime(o.lp1, t + (o.lpd || d)); f.Q.value = o.q || 0.8; node.connect(f); node = f; }
    const g = ctx.createGain(); node.connect(g); const pan = ctx.createStereoPanner(); pan.pan.value = o.pan || 0; g.connect(pan); pan.connect(o.dest || music);

  const clap = (t, v = 1) => { [0, 0.011, 0.022].forEach((o, i) => noise(t + o, i === 2 ? 0.17 : 0.012, { type: 'bandpass', f: 1250, q: 1.1, gain: 0.34 * v, send: i === 2 ? 0.35 : 0 })); };
  const hat = (t, v = 1, open = false, pan = 0.12) => noise(t, open ? 0.2 : 0.045, { f: 7600, gain: 0.14 * v, pan });
  const bass = (t, m, d, v = 1) => { tone(t, mtof(m), d, { type: 'sawtooth', lp: 900, lp1: 220, lpd: 0.16, gain: 0.2 * v, sustain: true, a: 0.004, r: 0.03 }); tone(t, mtof(m - 12), d, { type: 'sine', gain: 0.34 * v, sustain: true, a: 0.004, r: 0.03 }); };
  const pad = (t, ch, d, v = 1, lp = 1400) => ch.forEach((m, i) => [-7, 7].forEach((dt) => tone(t, mtof(m), d, { type: 'sawtooth', detune: dt, lp, gain: 0.028 * v, sustain: true, a: 0.25, r: 0.35, pan: (i - 1.5) * 0.25 + dt / 40, send: 0.5 })));
  const stab = (t, ch, v = 1) => ch.forEach((m, i) => tone(t, mtof(m + 12), 0.5, { type: 'sawtooth', lp: 4200, lp1: 500, lpd: 0.32, gain: 0.07 * v, pan: (i - 1.5) * 0.3, send: 0.45, dest: master }));
  const boom = (t, v = 1) => tone(t, 70, 1.3, { f1: 34, fd: 0.6, gain: 0.8 * v, dest: master });
  const crash = (t, v = 1, d = 2.6) => { noise(t, d, { f: 4200, gain: 0.3 * v, send: 0.4, pan: -0.15 }); noise(t, d * 0.8, { f: 8000, gain: 0.18 * v, pan: 0.2 }); };
  const uiClick = (t) => { tone(t, 2400, 0.03, { f1: 1500, fd: 0.02, gain: 0.07, dest: master, type: 'triangle' }); noise(t, 0.008, { f: 5000, gain: 0.06, dest: master }); };
  const chordAt = (b) => CHORDS[Math.floor(b / 4) % 4], rootAt = (b) => ROOTS[Math.floor(b / 4) % 4];

  for (let b = 0; b < 160; b++) {
    const t = tb(b);
    const groove = (b >= 8 && b < 120) || (b >= 128 && b < 140);
    const build = b >= 120 && b < 128;
    kick(t, build ? 0.7 : b >= 140 ? 0.85 : 1);
    if (groove && b % 2 === 1) clap(t, 0.9);
    if (b >= 140 && b % 4 === 3) clap(t, 0.6);
    if (b >= 4 && !build) {
      hat(t + 0.25, groove ? 1 : 0.7, groove && b % 2 === 1 && b < 108, 0.15);
      if ((b >= 108 && b < 120) || (b >= 128 && b < 140)) { hat(t + 0.125, 0.45, false, -0.2); hat(t + 0.375, 0.45, false, -0.2); }
    }
    if (groove || b >= 140) {
      const m = rootAt(b);
      bass(t + 0.25, b % 4 === 2 ? m + 12 : m, 0.2, b >= 140 ? 0.7 : 1);
      if (b % 4 === 3) bass(t + 0.0, m, 0.18, 0.7);
    }
    if (b % 4 === 0 && !build) pad(t, chordAt(b), 2.0, b < 8 ? 0.8 : b >= 140 ? 1.1 : 1, b < 8 ? 900 : 1500);
  }
  // the hook: long sub notes under the words
  [0, 4].forEach((b) => bass(tb(b), ROOTS[(b / 4) % 4], 1.95, 0.8));
  // build: riser + snare roll
  noise(tb(120), 4.0, { type: 'bandpass', f: 400, f1: 7000, q: 1.4, gain: 0.32, rise: true, dest: master, send: 0.3 });
  tone(tb(120), 110, 4.0, { type: 'sawtooth', f1: 880, fd: 4.0, lp: 2400, gain: 0.05, sustain: true, a: 3.8, r: 0.02, dest: master });
  { // 8ths → 16ths → 32nds → 64ths, rising
    const segs = [[0, 2, 0.25], [2, 3, 0.125], [3, 3.5, 0.0625], [3.5, 4, 0.03125]];
    for (const [a0, a1, step] of segs) for (let x = a0; x < a1 - 1e-6; x += step) noise(tb(120) + x, 0.09, { type: 'bandpass', f: 1500, q: 0.9, gain: 0.07 + 0.2 * (x / 4), send: 0.25 });
  }
  pad(tb(120), chordAt(120), 4.0, 0.9, 700);
  // scene-change hits (and the biggest one at b128)
  HITS.forEach((b) => { const t = tb(b); boom(t, b === 128 ? 1.1 : 0.85); stab(t, chordAt(b), b === 128 ? 1.3 : 1); noise(t, 0.3, { type: 'bandpass', f: 1800, q: 0.8, gain: 0.25, send: 0.5 }); if (b === 128) crash(t, 1.2, 3.2); if (b === 140) crash(t, 0.6, 2.4); });
  // last hit
  { const t = tb(159); boom(t, 0.9); stab(t, CHORDS[0], 1.1); crash(t, 0.5, 0.5); }

/* ───────────────────────── boot ───────────────────────── */
window.ready = document.fonts.load('200px Coolvetica').then(() => document.fonts.ready).then(() => {
  build();
  CAM.sort((a, b) => a.t0 - b.t0); OBJ.sort((a, b) => a.t0 - b.t0); CUR.sort((a, b) => a.t0 - b.t0); CLICKS.sort((a, b) => a - b);
  // memoise statement placements in time order (each depends only on the camera before it)
  STM.forEach((s) => placeOf(s));
  OBJ_CLICKS = CLICKS.filter((tc) => { const o = objAt(tc), q = curAt(tc); return Math.abs(o.x - q.x) < o.w * 0.6 && Math.abs(o.y - q.y) < o.h * 0.8; });
  seek(0);
  return true;

window.seek = seek;
window.renderAudio = renderAudio;
window.DUR = DUR;
// preview: ?t=12.5 shows that moment; ?play plays in real time (preview only — rendering always uses seek)
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('t')) seek(parseFloat(q.get('t')));

});
