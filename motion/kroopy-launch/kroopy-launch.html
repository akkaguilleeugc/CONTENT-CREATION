* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: #0B0F14; overflow: hidden; }
body { font-family: 'Coolvetica', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; font-kerning: normal; }
#frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0B0F14; }
#world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
#scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#plane { position: absolute; left: 91px; top: -10px; width: 390px; height: 844px; transform: scale(2.3); transform-origin: 0 0; }
.layer { position: absolute; left: 0; top: 0; width: 390px; height: 844px; visibility: hidden; }
.abs { position: absolute; }
.t2 { color: rgba(229, 237, 248, 0.68); }
.t3 { color: rgba(229, 237, 248, 0.45); }
.t4 { color: rgba(229, 237, 248, 0.26); }
.ink { color: #0B0F14; }
.ico { display: inline-block; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.panel { background: #11171f; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 18px; }
.sheet { background: #10161e; border: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 0; border-radius: 28px 28px 0 0; }
.handle { position: absolute; left: 50%; top: 9px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); }
.h1 { font-size: 36px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
.stopsq { display: inline-block; width: 7px; height: 7px; margin-left: 3px; background: #fff; border-radius: 1px; }
.lbl { font-size: 12px; color: rgba(229, 237, 248, 0.62); }
.input { position: absolute; height: 46px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.03); }
.input > .v { position: absolute; left: 14px; top: 15px; font-size: 15px; white-space: pre; line-height: 1; }
.btn { position: absolute; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; white-space: nowrap; }
.btn--line { border: 1px solid rgba(255, 255, 255, 0.14); }
.btn--soft { background: #1c2431; }
.chip { position: relative; height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.14); display: flex; align-items: center; font-size: 13px; white-space: nowrap; overflow: hidden; }
.chip .fill { position: absolute; inset: 0; background: #fff; border-radius: 16px; transform: scale(0); }
.chip .tx { position: relative; }
.tile { background: #161d27; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; }
.icobox { border-radius: 11px; background: #1f2835; display: flex; align-items: center; justify-content: center; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(229, 237, 248, 0.45); white-space: nowrap; }
.card { background: #11171f; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 18px; padding: 18px 18px 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
.kcard { background: #161d27; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; padding: 11px 12px; }
.ph { border: 1px dashed rgba(255, 255, 255, 0.13); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(229, 237, 248, 0.3); }
.bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
.bars i { display: block; width: 2.5px; border-radius: 1px; background: currentColor; }
.row { display: flex; align-items: center; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; }
.mask > span { display: inline-block; }
/* big type */
.st { position: absolute; left: 0; top: 0; transform-origin: 0 0; visibility: hidden; white-space: nowrap; }
.st .ln { display: block; line-height: 0.9; }
.st .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.02em 0.04em 0.14em 0; margin-bottom: -0.14em; margin-right: 0.18em; }
.st .m:last-child { margin-right: 0; }
.st .stopslot { margin-left: -0.13em !important; }
.st .w { display: inline-block; }
.st .key { color: #D4F53C; }
.st .stopslot { display: inline-block; width: 0.2em; height: 0.2em; margin-left: 0.03em; }
/* the through-line object */
#obj { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
#obj .shape { position: absolute; inset: 0; border: 0 solid #D4F53C; }
#obj .g { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#obj .gi { flex: none; color: #0B0F14; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
</head>

/* ───────────────────────── constants & time ───────────────────────── */
const W = 1080, H = 1920, K = 2.3, PX = 91, PY = -10;
const BEAT = 0.5, DUR = 80, LIME = '#D4F53C', INK = '#0B0F14';
const tb = (b) => b * BEAT;
const SCENES = [0, 8, 28, 56, 80, 108, 128, 140, 160]; // hook · capture · produce · plan · track · build · payoff · end
const HITS = [4, 8, 28, 56, 80, 108, 128, 140];

/* ───────────────────────── easing (pure functions of time) ───────────────────────── */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const expoIn = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);
/** Damped spring step response. ζ = 0.8 → ~1.5% overshoot (the "small overshoot" ceiling). */
function spring(dt, w = 16, z = 0.8) {
  if (dt <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const SP = (t, b, w = 16, z = 0.8) => spring(t - tb(b), w, z);
const EX = (t, b, d = 0.45) => expoOut(clamp((t - tb(b)) / d));
const EXt = (t, t0, d = 0.45) => expoOut(clamp((t - t0) / d));
/** A press: 0 → 1 → 0 within ~0.25s, peaking 60ms after tc. */
const pulse = (dt, k = 0.06) => (dt < 0 ? 0 : (dt / k) * Math.exp(1 - dt / k));

/* ───────────────────────── small DOM helpers ───────────────────────── */
const $ = (s) => document.querySelector(s);
const I = (name, size = 18, cls = '') => `<span class="ico ${cls}" style="width:${size}px;height:${size}px">${ICONS[name] || ''}</span>`;
const px = (v) => `${v}px`;
function st(el, o) { for (const k in o) el.style[k] = o[k]; }
function show(el, on) { el.style.visibility = on ? 'visible' : 'hidden'; }
const bars = (n, c = 'currentColor') => `<span class="bars" style="color:${c}">${[4, 7, 10, 13].slice(0, 4).map((h, i) => `<i style="height:${h * 0.75}px;opacity:${i < n ? 1 : 0.25}"></i>`).join('')}</span>`;

const plane = $('#plane');

const sceneS = (t) => { const b = t / BEAT; for (let i = 0; i < SCENES.length - 1; i++) if (b < SCENES[i + 1]) return i + (b - SCENES[i]) / (SCENES[i + 1] - SCENES[i]); return SCENES.length - 1; };
const PUSH = (t) => Math.pow(1.04, sceneS(t));

/** Camera: blended expo moves; on top, a constant push of 1.0 → 1.04 per scene that carries over between scenes. */
function camAt(t) {
  let cx = 540, cy = 960, lz = 0;
  for (const m of CAM) {
    if (t < m.t0) break;
    const p = m.ease(clamp((t - m.t0) / m.d));
    const T = typeof m.T === 'function' ? m.T(t) : m.T;
    const zt = Math.log(T.z / PUSH(m.t0 + m.d));
    cx += (T.cx - cx) * p; cy += (T.cy - cy) * p; lz += (zt - lz) * p;
  }
  return { cx, cy, z: Math.exp(lz) * PUSH(t) };
}
const toWorld = (c, sx, sy) => ({ x: c.cx + (sx - 540) / c.z, y: c.cy + (sy - 960) / c.z });
const toScreen = (c, x, y) => ({ x: (x - c.cx) * c.z + 540, y: (y - c.cy) * c.z + 960 });

let P0 = { x: 540, y: 2400, w: 124, h: 124, r: 50, rot: 0, fill: 1, s: 1 };
function objAt(t) {
  const P = { ...P0 };
  for (const m of OBJ) {
    if (t < m.t0) break;
    const s = spring(t - m.t0, m.w, m.z);
    const T = typeof m.T === 'function' ? m.T(t) : m.T;
    for (const k in T) if (T[k] != null) P[k] += (T[k] - P[k]) * s;
  }
  return P;
}
let C0 = { x: 1400, y: 2300 };
function curAt(t) {
  const P = { ...C0 };
  for (const m of CUR) {
    if (t < m.t0) break;
    const s = spring(t - m.t0, m.w, m.z);
    const T = typeof m.T === 'function' ? m.T(t) : m.T;
    P.x += (T.x - P.x) * s; P.y += (T.y - P.y) * s;
  }
  return P;
}

const STM = [];
function stmt(id, lines, o) {

    const key = o.key && o.key === w;
    const i = wi++;
    return `<span class="m"><span class="w${key ? ' key' : ''}" data-i="${i}">${w}</span></span>`;
  }).join('')}${o.stop && ln === lines[lines.length - 1] ? '<span class="stopslot"></span>' : ''}</div>`).join('');
  $('#stmts').appendChild(el);
  const s = { id, el, words: [...el.querySelectorAll('.w')], beats: o.beats, exit: o.exit, cy: o.cy ?? 860, size: o.size || 200, left: o.left ?? 96, knock: o.knock, align: o.align || 'left', exitStagger: o.exitStagger ?? 0.03, exitDt: o.exitDt ?? -0.3 };
  STM.push(s);
  return s;
}
function layoutStmt(s) {
  s.el.style.fontSize = s.size + 'px';
  s.el.style.visibility = 'hidden';
  const maxW = s.el.offsetWidth;
  const f = Math.min(s.size, (s.size * (s.maxW || 888)) / maxW);
  s.el.style.fontSize = f + 'px';
  s.Wd = s.el.offsetWidth; s.Ht = s.el.offsetHeight;
  const slot = s.el.querySelector('.stopslot');
  if (slot) s.slot = { x: slot.offsetLeft, y: slot.offsetTop, w: slot.offsetWidth, h: slot.offsetHeight, f };
  if (s.align === 'center') s.lines = [...s.el.querySelectorAll('.ln')].map((l) => l.scrollWidth);
}
/** Where a statement sits: camera centre at its first word, sized in screen px. Memoised (never changes). */
function placeOf(s) {
  if (s.place) return s.place;
  const c = camAt(tb(s.beats[0]) + 0.6);
  const sc = 1 / c.z;
  const left = s.align === 'center' ? c.cx - (s.Wd / 2) * sc : c.cx + (s.left - 540) * sc;
  const top = c.cy + (s.cy - s.Ht / 2 - 960) * sc;
  return (s.place = { left, top, sc });
}
/** The full stop's world rect (centre based). */
function stopRect(s) {
  const p = placeOf(s), q = s.slot;
  const w = q.w * p.sc;
  return { x: p.left + (q.x + q.w / 2) * p.sc, y: p.top + (q.y + q.h / 2) * p.sc, w, h: w, r: w * 0.14 };
}

/** Clip `el` (UI rect E) from the object's rect (p=0) to its full self (p=1). */
function clipFromObj(el, P, p, rFull = 18) {
  const E = el._r || (el._r = uiRect(el));
  if (p >= 1) { el.style.clipPath = 'none'; return; }
  if (p <= 0.002) { el.style.clipPath = 'inset(50% 50% 50% 50%)'; return; }
  const ox = (P.x - P.w / 2 - PX) / K - E.x, oy = (P.y - P.h / 2 - PY) / K - E.y, ow = P.w / K, oh = P.h / K;
  const q = 1 - Math.max(0, p);
  const top = oy * q, left = ox * q, right = (E.w - ox - ow) * q, bottom = (E.h - oy - oh) * q;
  el.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px round ${lerp(P.r / K, rFull, p)}px)`;
}
/** Generic unfold/fold of a layer element around the object: in at bIn, out at bOut. */
function around(el, t, P, bIn, bOut, o = {}) {
  const inP = o.inNow ? 1 : expoOut(clamp((t - tb(bIn) - (o.dIn || 0)) / (o.durIn || 0.55)));
  const outP = bOut == null ? 0 : expoInOut(clamp((t - tb(bOut) - (o.dOut || 0)) / (o.durOut || 0.38)));
  const p = Math.min(inP, 1 - outP);
  const on = t >= tb(bIn) + (o.dIn || 0) && (bOut == null || p > 0.002);
  show(el, on);
  if (on) clipFromObj(el, o.P || P, p, o.r ?? 18);
  return on ? p : 0;
}

function renderStatements(t, c) {
  let vIn = 0, vOut = 0;
  for (const s of STM) {
    const t0 = tb(s.beats[0]) - 0.08, t1 = tb(s.exit) + s.exitDt + 0.7;
    const on = t >= t0 && t < t1;
    show(s.el, on);
    if (!on) continue;
    const p = placeOf(s);
    s.el.style.transform = `translate(${p.left}px,${p.top}px) scale(${p.sc})`;
    s.words.forEach((w, i) => {
      const tw = tb(s.beats[i]);
      const yIn = (tt) => 118 * (1 - spring(tt - tw, 17, 0.82));
      let y = yIn(t);
      if (s.knock != null && i === s.knock) {
        const tk = tb(s.knock) + 0.2;
        if (t >= tk) y = lerp(yIn(tk), 130, spring(t - tk, 20, 0.8));

      const te = tb(s.exit) + s.exitDt + i * s.exitStagger;
      const pe = clamp((t - te) / 0.32);
      const outE = (q) => Math.pow(q, 2.2);
      if (pe > 0) y = y - 125 * outE(pe);
      w.style.transform = `translateY(${y}%)`;
      // vertical speed → motion blur (screen px per second)
      const fs = parseFloat(s.el.style.fontSize) || 200;
      const dIn = (yIn(t) - yIn(t - 1 / 240)) * 240 * fs * 0.01;
      const dOut = pe > 0 && pe < 1 ? (125 * (outE(pe) - outE(clamp(pe - 1 / 240 / 0.32))) * 240 * fs * 0.01) : 0;
      const moving = Math.abs(dIn) > 600 ? 'in' : dOut > 600 ? 'out' : '';
      w.style.filter = moving === 'in' ? 'url(#fIn)' : moving === 'out' ? 'url(#fOut)' : 'none';
      if (moving === 'in') vIn = Math.max(vIn, Math.abs(dIn));
      if (moving === 'out') vOut = Math.max(vOut, dOut);
    });
  }
  gIn.setAttribute('stdDeviation', `0 ${Math.min(14, vIn / 380).toFixed(2)}`);
  gOut.setAttribute('stdDeviation', `0 ${Math.min(14, vOut / 380).toFixed(2)}`);
}

  pad(tb(120), chordAt(120), 4.0, 0.9, 700);
  // scene-change hits (and the biggest one at b128)
  HITS.forEach((b) => { const t = tb(b); boom(t, b === 128 ? 1.1 : 0.85); stab(t, chordAt(b), b === 128 ? 1.3 : 1); noise(t, 0.3, { type: 'bandpass', f: 1800, q: 0.8, gain: 0.25, send: 0.5 }); if (b === 128) crash(t, 1.2, 3.2); if (b === 140) crash(t, 0.6, 2.4); });
  // last hit
  { const t = tb(159); boom(t, 0.9); stab(t, CHORDS[0], 1.1); crash(t, 0.5, 0.5); }
  // the cursor's clicks
  CLICKS.forEach((t) => uiClick(t));

  const buf = await ctx.startRendering();
  // normalise to −1 dBFS and encode 16-bit PCM WAV
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0; for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const g = 0.891 / (peak || 1);
  const fadeN = Math.round(0.04 * SR);
  const n = L.length, out = new DataView(new ArrayBuffer(44 + n * 4));
  const w4 = (o, s) => [...s].forEach((ch, i) => out.setUint8(o + i, ch.charCodeAt(0)));
  w4(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w4(8, 'WAVE'); w4(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w4(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    const f = i > n - fadeN ? (n - i) / fadeN : 1;
    out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * g * f)) * 32767, true);
    out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * g * f)) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

/* ───────────────────────── boot ───────────────────────── */
window.ready = document.fonts.load('200px Coolvetica').then(() => document.fonts.ready).then(() => {
  build();
  CAM.sort((a, b) => a.t0 - b.t0); OBJ.sort((a, b) => a.t0 - b.t0); CUR.sort((a, b) => a.t0 - b.t0); CLICKS.sort((a, b) => a - b);
  // memoise statement placements in time order (each depends only on the camera before it)
  STM.forEach((s) => placeOf(s));
  OBJ_CLICKS = CLICKS.filter((tc) => { const o = objAt(tc), q = curAt(tc); return Math.abs(o.x - q.x) < o.w * 0.6 && Math.abs(o.y - q.y) < o.h * 0.8; });
  seek(0);
  return true;
});
window.seek = seek;
window.renderAudio = renderAudio;
window.DUR = DUR;
// preview: ?t=12.5 shows that moment; ?play plays in real time (preview only — rendering always uses seek)
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('t')) seek(parseFloat(q.get('t')));
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script>
